<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário, Milena</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- HERO -->
        <section id="hero">

            <!-- JS da digitação -->
            <h1 id="titulo"></h1>

            <p class="hidden">
                Uma lembrança feita especialmente para você 💙
            </p>

            <div class="seta">
                ↓
            </div>

        </section>

        <!-- GALERIA -->
        <section id="galeria" class="hidden">

            <h2>Alguns momentos</h2>

            <div class="carrossel">

                <img src="img/foto01.jpeg" alt="">
                <img src="img/foto02.jpeg" alt="">
                <img src="img/foto03.jpeg" alt="">
                <img src="img/foto04.jpeg" alt="">
                <img src="img/foto05.jpeg" alt="">
                <img src="img/foto06.jpeg" alt="">
                <img src="img/foto07.jpeg" alt="">
                <img src="img/foto08.jpeg" alt="">
                <img src="img/foto09.jpeg" alt="">
                <img src="img/foto10.jpeg" alt="">

            </div>

        </section>

        <!-- MÚSICA -->
        <section id="musica" class="hidden">

            <div class="player">

                <!-- capa que vai girar -->
                <img id="capa" src="img/vinil.png" alt="Capa da música">

                <h3>Acontece</h3>

                <p>Jão</p>

                <button id="play">
                    ▶
                </button>

                <audio id="audio">
                    <source src="audio/musica.mp3" type="audio/mpeg">
                </audio>

            </div>

        </section>

        <!-- CARTA -->
        <section id="carta">

            <div class="container-carta hidden">

                <h2>Uma carta</h2>

                <p>
                    Aqui vai toda a mensagem...
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
